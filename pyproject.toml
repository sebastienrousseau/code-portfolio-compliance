[project]
name = "code-portfolio-compliance"
version = "0.0.1"
description = "Static audit of workspace repositories against the portfolio compliance matrix"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
audit-compliance = "audit_compliance:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "radon==6.0.1", "complexipy==8.3.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tools/audit_compliance.py", "tools/compliance_checks.py", "tools/compliance_report.py"]
sources = ["tools"]

[tool.ruff]
# The tool was written about this wide; 160 keeps reformatting churn lowest.
line-length = 160
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "scripts"]
