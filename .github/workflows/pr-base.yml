name: PR Base

# Every pull request must target the default branch. The other workflows
# filter on `branches: [main]`, so a PR aimed elsewhere runs no CI and is
# later recorded as merged with an empty range. No branches filter here, on
# purpose.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  base-is-default-branch:
    name: PR targets default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${BASE}" = "${DEFAULT}" ]; then echo "base branch is '${BASE}'"; exit 0; fi
          echo "::error::This pull request targets '${BASE}'; every pull request must target '${DEFAULT}'."
          exit 1
