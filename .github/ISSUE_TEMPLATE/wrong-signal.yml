name: Wrong signal
description: A check passes or fails a repository when the matrix says otherwise
labels: [bug]
body:
  - type: input
    id: signal
    attributes:
      label: Signal
      placeholder: C2.L1
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: Repository and evidence
      description: Which repository, what the tool reported, and the file or line of the matrix that says it should be different.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Output of `git -C ~/Code/Private/Python/code-portfolio-compliance describe --always; python3 --version`
      render: text
    validations:
      required: true
